plugins {
    id 'java'
    id 'application'
}

group 'com.mygame'
version '1.0'

application {
    applicationName = 'MyChess'
    mainClass = 'com.mygame.Main'
    // Mac OS with LWJGL 3 needs to be started with this JVM argument
    if (System.getProperty("os.name").toLowerCase().contains("mac")) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

project.ext {
    jmeVer = '3.7.0-stable'
}

project(":assets") {
    apply plugin: "java"

    buildDir = rootProject.file("build/assets")

    sourceSets {
        main {
            resources {
                srcDir '.'
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }
}

dependencies {

    // Core JME
    implementation "org.jmonkeyengine:jme3-core:$jmeVer"
    implementation "org.jmonkeyengine:jme3-desktop:$jmeVer"
    // Mac OS with LWJGL 3 doesn't allow AWT/Swing
    if (!System.getProperty("os.name").toLowerCase().contains("mac")) {
        implementation "org.jmonkeyengine:jme3-awt-dialogs:$jmeVer"
    }
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmeVer"

    // Suppress errors / warnings building in SDK
    implementation "org.jmonkeyengine:jme3-jogg:$jmeVer"
    implementation "org.jmonkeyengine:jme3-plugins:$jmeVer"
  
    // GUI Library
    implementation "org.jmonkeyengine:jme3-niftygui:$jmeVer"

    // Additional Libraries
    implementation "org.jmonkeyengine:jme3-terrain:$jmeVer"
    implementation "org.jmonkeyengine:jme3-testdata:$jmeVer"
    
    // https://mvnrepository.com/artifact/com.simsilica/lemur
    implementation group: 'com.simsilica', name: 'lemur', version: '1.16.0'
    // https://mvnrepository.com/artifact/com.simsilica/lemur-proto
    implementation group: 'com.simsilica', name: 'lemur-proto', version: '1.13.0'

    // Standard utility stuff
    // https://mvnrepository.com/artifact/com.google.guava/guava
    implementation group: 'com.google.guava', name: 'guava', version: '33.3.1-jre'

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.16'
    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-slf4j-impl
    testImplementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: '2.24.1'
    // https://mvnrepository.com/artifact/org.jmonkeyengine/jme3-examples
    implementation group: 'org.jmonkeyengine', name: 'jme3-examples', version: '3.7.0-beta1.2.2'

    

// https://mvnrepository.com/artifact/org.codehaus.groovy/groovy-all
implementation("org.codehaus.groovy:groovy-all:3.0.25")
    
    // Assets sub-project
    runtimeOnly project(':assets')
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

wrapper {
    gradleVersion = '8.6'
}
